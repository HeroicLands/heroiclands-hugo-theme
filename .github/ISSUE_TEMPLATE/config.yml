blank_issues_enabled: false
contact_links:
    - name: Report a security vulnerability (private)
      url: https://github.com/HeroicLands/heroiclands-hugo-theme/security/advisories/new
      about: Exploitable weaknesses must be reported privately as a security advisory — never as a public issue. See the Security Policy and issue-reporting §7.
    - name: A page that is wrong on only one site
      url: https://github.com/HeroicLands/heroiclands-hugo-theme/blob/main/.github/ISSUE_REPORTING.md#9-which-repository-does-an-issue-belong-in
      about: If only one consuming site renders it wrong, the fault is usually in that site's content or config, not in the theme. Check §9 before filing here.
    - name: Question or discussion
      url: https://bit.ly/44vZ10j
      about: For questions and general discussion, use the SoHL Discord.
