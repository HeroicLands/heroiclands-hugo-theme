# Dependabot version updates.
#
# Labels are pinned to `devops` deliberately. Dependabot's own default label is
# `dependencies`, which is not in `.github/labels.yml` — and that registry is a
# closed set, so `labels-sync.yml` would delete the label again on the next push
# to `main`. Naming a managed label keeps the two from fighting.
#
# `github-actions` matters more here than `npm` does. This package has one
# devDependency, but its workflows include the one that publishes to npm, and
# that path is credential-bearing: it exchanges an OIDC token for a short-lived
# npm credential through Trusted Publishing. Every consumer takes this package
# from the registry now rather than as a git submodule, so this repository's
# supply chain is three sites' supply chain. See #21.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - devops
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - devops
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"
