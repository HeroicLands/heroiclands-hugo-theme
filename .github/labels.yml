# Authoritative label registry for the heroiclands-hugo-theme repository.
#
# This file is the machine-readable source of truth for §3 of
# .github/ISSUE_REPORTING.md — the two are kept in sync by
# `utils/check-labels.mjs` (run as `npm run lint:labels`, and in CI by the
# `lint` workflow). Editing the registry means editing BOTH: this file
# (name/color/description) and the §3 table.
#
# GitHub's labels are reconciled to this file by `utils/sync-labels.mjs`, run by
# .github/workflows/labels-sync.yml. The set is CLOSED: any label on GitHub that
# is not listed here is deleted on sync. Do not invent labels — extending the
# registry is a deliberate edit to this file and §3.
#
# This repository holds presentation only — layouts, partials, and static
# assets — and no content, no packages and no addresses. `content`, `system`,
# `tests` and `site` are therefore absent: every issue here is about the theme,
# so a `site` label would carry no information.

- name: layout
  color: "1d76db"
  description: Templates, partials, shortcodes — the structure a page renders into.

- name: styling
  color: "c2a3ff"
  description: CSS, fonts, images, icons, palette — how a rendered page looks.

- name: documentation
  color: "0075ca"
  description: Documentation about this repository — README, theme.toml, process, authoring guides.

- name: devops
  color: "e07b31"
  description: Build, tooling, release pipeline, repo config.

- name: security
  color: "b60205"
  description: "Attack surface: injection into rendered HTML, unsafe template output, external resources."

- name: tech-debt
  color: "68691b"
  description: Restructuring or cleanup of working templates or styles; refactors.

- name: regression
  color: "d93f0b"
  description: Something that previously rendered correctly and stopped. Pairs with type bug.

- name: breaking-change
  color: "8d0f09"
  description: Changes a partial's contract, a required param, or a class name consumers depend on.

- name: blocked
  color: "c5702e"
  description: Cannot proceed until an external dependency or another issue clears.

- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists.

- name: question
  color: "0f5594"
  description: Further information is requested.

- name: wontfix
  color: "ffffff"
  description: This will not be worked on.
