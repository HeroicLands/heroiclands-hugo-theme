name: Lint

# Two declarations this repository cannot check while rendering, because it never
# renders: it is a Hugo theme, built by its consumers. Every other repository in
# the project runs its guards from its build; these run here instead.
#
#   check-labels  — .github/labels.yml and the §3 table in
#                   .github/ISSUE_REPORTING.md must name the same labels.
#   check-banners — every banner data/banners.yaml declares must actually be
#                   published. hero-banner.html trusts that list to decide what
#                   exists, since Hugo cannot ask a remote asset host; nothing
#                   but a fetch can keep it honest (issue #36). This step
#                   therefore needs outbound network.
#
# It also carries the release gate: every pull request must declare its intended
# bump as a changeset (#30). That check lives here rather than in a workflow of
# its own because this is the workflow a pull request already waits on.

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    lint:
        name: Declarations
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run lint

    # Every pull request declares the release it intends — a bump, or an empty
    # changeset saying it needs none. This is the gate that keeps a version from
    # being merged and then forgotten: the release pipeline versions from
    # changesets, so a change that adds none ships nothing (#30).
    #
    # It reports on the two pull requests that legitimately carry no changeset —
    # the version one, since consuming them is precisely what it does, and
    # Dependabot's, since this package publishes `layouts`, `static`, `data` and
    # `theme.toml` and declares no runtime dependencies at all, so no npm
    # dependency of it ever reaches a consumer. The check step is skipped for
    # those and the job still succeeds, rather than the job being skipped,
    # because a skipped job reports a skipped check and a required context wants
    # a passing one. Whether a branch pushed with GITHUB_TOKEN starts workflow
    # runs is not a thing to bet the release train on either way.
    changeset:
        name: Changeset declared
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            # `changeset status --since` compares against a ref, so `main` has to
            # exist locally: a pull-request checkout is a detached merge commit
            # with no branches.
            - name: Fetch main
              run: git fetch --no-tags origin main:refs/remotes/origin/main
            # `changeset-release/*` is the branch changesets/action opens the
            # version pull request from.
            #
            # Dependabot is matched on the pull request's **author**, not on its
            # branch name. The branch prefix (`dependabot/…`) is the obvious
            # alternative and is what the `changeset-release/` case uses, but a
            # branch name is anybody's to choose, while the author is GitHub's to
            # set — and unlike `github.actor` it does not change to a human when
            # one reopens the pull request or pushes a fixup to it.
            - name: Changeset present
              if: >-
                  ${{ !startsWith(github.head_ref, 'changeset-release/')
                  && github.event.pull_request.user.login != 'dependabot[bot]' }}
              run: npm run changeset:check
            - name: This pull request is the bump
              if: ${{ startsWith(github.head_ref, 'changeset-release/') }}
              run: >-
                  echo 'Version pull request: it consumes the changesets rather
                  than declaring one.'
            - name: This pull request is a dependency bump
              if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
              run: >-
                  echo 'Dependabot pull request: this package declares no runtime
                  dependencies and ships no JavaScript, so a bump reaches no
                  consumer and declares no release.'
