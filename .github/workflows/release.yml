name: Publish to npm

# Publishing is deliberately explicit: cutting a GitHub Release publishes the
# version currently in package.json. There is no changesets pipeline here — the
# package is hand-versioned, as it was when it lived in the system repository.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # id-token: write is what npm Trusted Publishing (OIDC) exchanges for a
  # short-lived credential. There is no NPM_TOKEN in this repository.
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @heroiclands/hugo-theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Guard the release path with the same check `main` gets, so a
      # tag cut from a red commit cannot publish. The theme has no test
      # suite and nothing to compile — it ships Hugo templates — so this
      # is the whole of its gate.
      - run: npm run lint

      # The package is layouts, not code: what can silently go wrong is
      # shipping a tarball that is missing one. Publishing a theme whose
      # `layouts/` never arrived would fail on the consuming site, not
      # here, so it is checked before the publish rather than after.
      - name: The tarball carries the theme
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const [p] = require("/tmp/pack.json");
            const files = p.files.map((f) => f.path);
            const missing = ["theme.toml", "data/sohl.yaml"].filter(
                (f) => !files.includes(f),
            );
            const dirs = ["layouts/", "static/"].filter(
                (d) => !files.some((f) => f.startsWith(d)),
            );
            if (missing.length || dirs.length) {
                console.error("Tarball is missing:", [...missing, ...dirs]);
                process.exit(1);
            }
            console.log(`Tarball carries ${files.length} files.`);
          '

      # OIDC Trusted Publishing needs npm >= 11.5; the runner ships older.
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest

      # Idempotent: re-running the workflow on an already-published
      # version is a no-op rather than an error.
      - name: Publish if the version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@heroiclands/hugo-theme@$VERSION" version >/dev/null 2>&1; then
              echo "@heroiclands/hugo-theme@$VERSION already published — skipping."
          else
              npm publish
          fi
