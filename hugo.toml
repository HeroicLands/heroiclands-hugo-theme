# Theme-level defaults, merged into every consuming site's config.
#
# This theme carries LAYOUT, NOT ADDRESSES. It is shared by every repository
# that renders pages, so a site-specific URL written here would render on all
# of them — and would follow a package repository that was taken over and
# published somewhere else, pointing its navigation back at the site it left.
#
# So: no host, no absolute URL, and no root-relative path that assumes a
# package lives at a particular prefix appears in this theme. Every such
# address is supplied by the consuming repository's own configuration. See
# README.md for the full contract; in brief a consumer supplies:
#
#   [menu.main]        the brand navigation (absolute URLs when the entries
#                      cross hosts, so one header works on every subdomain)
#   params.cdnBaseURL  root of the host serving shared artwork
#   params.brand.*     logo, licenseURL, discordURL — the chrome's own links
#   params.home.*      hero and entry-point cards for the theme's home layout
#
# Everything below is address-free rendering configuration, which every
# consumer wants identically.

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "monokai"

[taxonomies]
  tag = "tags"
