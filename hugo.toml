# Theme-level defaults, merged into every consuming site's config.
# The brand nav lives here with ABSOLUTE www URLs so the header is identical and
# works across every subdomain (www, kb) — a relative "/blog/" would 404 on kb.

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "monokai"

