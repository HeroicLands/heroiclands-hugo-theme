{{- /*
  Breadcrumbs partial.

  A site publishes a homepage and one page per note, with no landing or
  catalog page between them, so a page's trail is always two steps:

    Home > {Title}

  The home page itself renders none.
*/ -}}
{{- if .IsHome -}}{{- return -}}{{- end -}}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ .Site.Home.RelPermalink }}">Home</a></li>
    <li aria-current="page">{{ .Title }}</li>
  </ol>
</nav>
